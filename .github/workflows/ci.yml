name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

# A superseded run tells you nothing. Cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The gate is ~15s of work. If it ever approaches this, something is
    # reaching the network that should not be.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen: fail if uv.lock is stale rather than silently re-resolving,
      # so CI tests the dependency set that is actually committed.
      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      # No model, no network. Real model responses get recorded into committed
      # fixtures at M2 and replayed here.
      - name: Tests
        run: uv run pytest

      # The study script is prose whose every claim is asserted against the
      # repository. Running it here means a documentation claim that stops
      # being true fails the build instead of quietly misleading a reader.
      - name: Study script claims still hold
        run: uv run python scripts/study_the_harness.py

      # The image copies the committed report, so a stale copy would publish
      # numbers that no longer match the artifacts. Rendering is deterministic,
      # so re-rendering and diffing proves the committed page is current.
      - name: Committed report matches the evaluation artifacts
        run: |
          uv run dep-triage report --output results/report.html
          git diff --exit-code -- results/report.html

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify build-context exclusions with synthetic canaries
        run: python3 scripts/check_docker_context.py

      - name: Build locked runtime image
        run: docker build --tag dep-triage-agent:ci .

      - name: Offline container acceptance
        # No model/network, root privileges, or writable root filesystem.
        # Only /tmp is writable; the script is supplied over stdin.
        run: |
          docker run --rm --network none dep-triage-agent:ci version
          docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python dep-triage-agent:ci - < scripts/smoke_container.py

      - name: Offline service acceptance
        # The service must serve its report and degrade /ask to a notice with
        # no backend reachable. That asymmetry is what the deployment relies on.
        run: |
          docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,nosuid,noexec,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python dep-triage-agent:ci - < scripts/smoke_service.py

      - name: Deploy scripts are valid and refuse to publish by default
        run: |
          bash -n deploy/publish_hf_space.sh
          bash -n deploy/azure.sh
          SPACE_ID=ci/dry-run ./deploy/publish_hf_space.sh | tee /tmp/hf.log
          grep -q "DRY RUN" /tmp/hf.log
          grep -q "secret scan: clean" /tmp/hf.log

  # Publishing the image is how the service stays runnable by anyone, now that
  # free container hosting is no longer available. GHCR is free for public
  # images and authenticates with the workflow's own token, so this needs no
  # account, no card and no stored credential.
  publish-image:
    needs: [check, container]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tagged by commit as well as latest, so a reported result can be
          # traced to the exact image that produced it.
          tags: |
            ghcr.io/${{ github.repository_owner }}/dep-triage-agent:latest
            ghcr.io/${{ github.repository_owner }}/dep-triage-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
