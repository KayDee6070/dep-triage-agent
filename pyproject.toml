[project]
name = "dep-triage-agent"
version = "0.1.0"
description = "A tool-using LLM agent for dependency security triage, with an evaluation harness that measures it"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kuntal Dive" }]
requires-python = ">=3.12,<3.13"

# Dependencies are added at the milestone that needs them, so clone-to-green
# stays fast. LangGraph arrives at M2, FastAPI + structlog + prometheus at M6.
dependencies = [
    "packaging>=24.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
]

[project.scripts]
dep-triage = "dep_triage.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dep_triage"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# Strict from day one: adopting it later on a grown codebase is far more
# expensive than paying for it now, while there are 200 lines to fix.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
